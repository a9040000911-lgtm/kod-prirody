<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F291E"/>
      <stop offset="100%" stop-color="#04120D"/>
    </linearGradient>
    <linearGradient id="dnaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#E8A838"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glowing Circle Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#bgGrad)" stroke="#14B8A6" stroke-width="3" stroke-dasharray="8 4" opacity="0.9"/>
  <circle cx="60" cy="60" r="48" stroke="url(#leafGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- DNA Double Helix Base Strands -->
  <path d="M 40 30 Q 60 50 80 70 T 40 90" stroke="url(#dnaGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 80 30 Q 60 50 40 70 T 80 90" stroke="url(#leafGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Connecting Base Pairs Rungs -->
  <line x1="45" y1="40" x2="75" y2="40" stroke="#5EEAD4" stroke-width="2" opacity="0.7"/>
  <line x1="52" y1="52" x2="68" y2="52" stroke="#FDE68A" stroke-width="2" opacity="0.7"/>
  <line x1="52" y1="68" x2="68" y2="68" stroke="#5EEAD4" stroke-width="2" opacity="0.7"/>
  <line x1="45" y1="80" x2="75" y2="80" stroke="#FDE68A" stroke-width="2" opacity="0.7"/>

  <!-- Sprout / Leaf Feature Icon at Center -->
  <path d="M 60 60 C 60 42 75 36 82 36 C 82 52 70 60 60 60 Z" fill="url(#dnaGrad)" opacity="0.9"/>
  <path d="M 60 60 C 60 45 45 40 40 42 C 40 55 52 60 60 60 Z" fill="url(#leafGrad)" opacity="0.95"/>

  <!-- Center Core Node -->
  <circle cx="60" cy="60" r="4" fill="#FFFFFF" filter="url(#glow)"/>
</svg>