<svg viewBox="0 0 1400 620" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0b1320"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="teal-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ce6f2"/>
      <stop offset="100%" stop-color="#00e0b8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1400" height="620" rx="24" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>

  <!-- Title Header -->
  <text x="700" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">МЕХАНИЗМ ДЕЙСТВИЯ СЕЛЕКТИВНОГО РНК-БИОГЕРБИЦИДА «ГЕРАЩИТ»</text>
  <text x="700" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#0ce6f2" letter-spacing="0.5">Трехэтапный молекулярный каскад SIGS: от ИИ-дизайна до нокдауна генов Heracleum sosnowskyi</text>

  <!-- STEP 1: ИИ-Таргетинг -->
  <g transform="translate(40, 100)">
    <rect width="410" height="460" rx="20" fill="url(#card-bg)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="6" rx="3" fill="url(#teal-accent)"/>
    
    <text x="30" y="42" font-size="12" font-weight="800" fill="#0ce6f2" letter-spacing="1">ЭТАП 01</text>
    <text x="30" y="70" font-size="20" font-weight="800" fill="#ffffff">1. ИИ-Таргетинг RiNALMo</text>
    <text x="30" y="92" font-size="12" fill="#94a3b8">Биоинформатический in silico скрининг мишеней</text>

    <!-- Visual Box 1 -->
    <rect x="30" y="115" width="350" height="210" rx="14" fill="#050b14" stroke="#1e293b"/>
    
    <!-- DNA Strand Graphic -->
    <path d="M 60 145 C 90 185, 90 205, 60 245 C 90 285, 90 305, 60 310" fill="none" stroke="#0ce6f2" stroke-width="3.5" filter="url(#glow)"/>
    <path d="M 90 145 C 60 185, 60 205, 90 245 C 60 285, 60 305, 90 310" fill="none" stroke="#00e0b8" stroke-width="3.5"/>
    <line x1="65" y1="165" x2="85" y2="165" stroke="#38bdf8" stroke-width="2"/>
    <line x1="72" y1="195" x2="78" y2="195" stroke="#38bdf8" stroke-width="2"/>
    <line x1="65" y1="225" x2="85" y2="225" stroke="#38bdf8" stroke-width="2"/>
    <line x1="65" y1="265" x2="85" y2="265" stroke="#38bdf8" stroke-width="2"/>

    <!-- Target Matching Graphic -->
    <rect x="130" y="140" width="230" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="145" y="165" font-size="11" font-weight="700" fill="#38bdf8">ИИ-Поиск 300 п.н. окна мишени:</text>
    <text x="145" y="190" font-size="12" font-weight="800" fill="#4ade80">✓ PPO1 [MK096772.1] — Некрозы</text>
    <text x="145" y="215" font-size="12" font-weight="800" fill="#4ade80">✓ GS1 [RefSeq] — Аммиак</text>
    <text x="145" y="240" font-size="12" font-weight="800" fill="#4ade80">✓ ACCase [RefSeq] — Липиды</text>
    <text x="145" y="275" font-size="11" font-weight="700" fill="#0ce6f2">Офф-таргет риск &lt; 0.1% (BLAST+)</text>

    <!-- Description -->
    <text x="30" y="355" font-size="12" fill="#cbd5e1" width="350">
      <tspan x="30" dy="0">Алгоритм RiNALMo подбирает видоспецифичные</tspan>
      <tspan x="30" dy="18">последовательности дсРНК, комплементарные</tspan>
      <tspan x="30" dy="18">исключительно геному Борщевика Сосновского.</tspan>
    </text>
    
    <rect x="30" y="410" width="350" height="30" rx="8" fill="#0284c7" fill-opacity="0.15" stroke="#0369a1"/>
    <text x="205" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8">Нулевое поражение пшеницы, сои и флоры</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 465 330 L 485 330" stroke="#0ce6f2" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="485,324 497,330 485,336" fill="#0ce6f2"/>

  <!-- STEP 2: Нанодоставка -->
  <g transform="translate(495, 100)">
    <rect width="410" height="460" rx="20" fill="url(#card-bg)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="6" rx="3" fill="url(#teal-accent)"/>
    
    <text x="30" y="42" font-size="12" font-weight="800" fill="#0ce6f2" letter-spacing="1">ЭТАП 02</text>
    <text x="30" y="70" font-size="20" font-weight="800" fill="#ffffff">2. СТП-Нанодоставка</text>
    <text x="30" y="92" font-size="12" fill="#94a3b8">Преодоление кутикулы &amp; УФ-защита</text>

    <!-- Visual Box 2 -->
    <rect x="30" y="115" width="350" height="210" rx="14" fill="#050b14" stroke="#1e293b"/>

    <!-- Leaf Cross-Section Diagram -->
    <!-- Wax layer -->
    <rect x="50" y="145" width="310" height="14" rx="4" fill="#ca8a04" fill-opacity="0.6"/>
    <text x="205" y="156" text-anchor="middle" font-size="10" font-weight="800" fill="#fef08a">Гидрофобный восковой слой кутикулы (3× толще)</text>
    
    <!-- Cell Wall Layer -->
    <rect x="50" y="165" width="310" height="24" rx="4" fill="#15803d" fill-opacity="0.5"/>
    <text x="205" y="181" text-anchor="middle" font-size="10" font-weight="800" fill="#bbf7d0">Клеточная стенка &amp; Эпидермис листа</text>

    <!-- Nanoparticles penetration -->
    <circle cx="120" cy="135" r="12" fill="#0ce6f2" filter="url(#glow)"/>
    <circle cx="205" cy="152" r="10" fill="#00e0b8"/>
    <circle cx="280" cy="177" r="11" fill="#38bdf8" filter="url(#glow)"/>

    <path d="M 205 130 Q 205 190 205 230" fill="none" stroke="#0ce6f2" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="201,230 205,238 209,230" fill="#0ce6f2"/>

    <!-- Cytoplasm Area -->
    <rect x="50" y="200" width="310" height="105" rx="8" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-dasharray="3,3"/>
    <text x="205" y="222" text-anchor="middle" font-size="12" font-weight="800" fill="#34d399">Цитоплазма клеток борщевика</text>
    <text x="205" y="250" text-anchor="middle" font-size="11" fill="#e2e8f0">Освобождение дсРНК 300 п.н.</text>
    <text x="205" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#fde047">Дождестойкость &gt; 94% | УФ-защита 30 дней</text>

    <!-- Description -->
    <text x="30" y="355" font-size="12" fill="#cbd5e1">
      <tspan x="30" dy="0">Звёздчатые поликатионы СТП-Полиплекс™</tspan>
      <tspan x="30" dy="18">(30–80 нм, Zeta ≥ +25 мВ) гарантируют проникание</tspan>
      <tspan x="30" dy="18">дсРНК через сверхплотную кутикулу сорняка.</tspan>
    </text>
    
    <rect x="30" y="410" width="350" height="30" rx="8" fill="#059669" fill-opacity="0.15" stroke="#047857"/>
    <text x="205" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">Системный транспорт по флоэме в корень</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 920 330 L 940 330" stroke="#0ce6f2" stroke-width="3"/>
  <polygon points="940,324 952,330 940,336" fill="#0ce6f2"/>

  <!-- STEP 3: Сайленсинг -->
  <g transform="translate(950, 100)">
    <rect width="410" height="460" rx="20" fill="url(#card-bg)" stroke="#1e293b" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="6" rx="3" fill="url(#teal-accent)"/>
    
    <text x="30" y="42" font-size="12" font-weight="800" fill="#0ce6f2" letter-spacing="1">ЭТАП 03</text>
    <text x="30" y="70" font-size="20" font-weight="800" fill="#ffffff">3. Клеточный Сайленсинг</text>
    <text x="30" y="92" font-size="12" fill="#94a3b8">DCL4 / AGO1 нокдаун мРНК мишеней</text>

    <!-- Visual Box 3 -->
    <rect x="30" y="115" width="350" height="210" rx="14" fill="#050b14" stroke="#1e293b"/>

    <!-- RISC Complex Graphic -->
    <circle cx="120" cy="185" r="45" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="180" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">RISC</text>
    <text x="120" y="198" text-anchor="middle" font-size="10" font-weight="700" fill="#38bdf8">AGO1 / DCL4</text>

    <!-- mRNA Cut Graphic -->
    <path d="M 190 185 L 260 185" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
    <text x="265" y="180" font-size="18" fill="#ef4444" font-weight="900">✂</text>
    <path d="M 285 185 L 350 185" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>

    <!-- Outcome badges -->
    <rect x="50" y="245" width="310" height="65" rx="10" fill="#7f1d1d" fill-opacity="0.3" stroke="#991b1b"/>
    <text x="205" y="268" text-anchor="middle" font-size="12" font-weight="900" fill="#fca5a5">СИНТЕЗ БЕЛКОВ PPO1 / GS1 ОСТАНОВЛЕН</text>
    <text x="205" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#f87171">Фолиарный некроз (2-4д) &amp; Гибель очага</text>

    <!-- Description -->
    <text x="30" y="355" font-size="12" fill="#cbd5e1">
      <tspan x="30" dy="0">Комплекс RISC точечно разрезает мРНК сорняка.</tspan>
      <tspan x="30" dy="18">Растение теряет способность к фотосинтезу.</tspan>
      <tspan x="30" dy="18">Свободная дсРНК распадается в почве (DT₅₀ &lt; 24ч).</tspan>
    </text>
    
    <rect x="30" y="410" width="350" height="30" rx="8" fill="#991b1b" fill-opacity="0.2" stroke="#7f1d1d"/>
    <text x="205" y="430" text-anchor="middle" font-size="11" font-weight="700" fill="#fca5a5">Экологически чистое искоренение без химии</text>
  </g>

  <!-- Footer Info Bar -->
  <text x="700" y="590" text-anchor="middle" font-size="11" fill="#64748b" font-weight="600">
    ООО «Код природы» | Технология РНК-Интерференции (SIGS) | Поддержка Приказа № 107 Роспатента РФ
  </text>
</svg>